name: Frontend (Angular)

on:
  push:
    branches: [main, dev]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/echange-temps

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/echange-temps/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Formatage (prettier)
        run: npx prettier --check src

      - name: Tests (vitest)
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build
