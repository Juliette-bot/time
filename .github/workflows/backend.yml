name: Backend (Quarkus)

on:
  push:
    branches: [main, preprod]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Compiles + runs the tests.
      # No PostgreSQL service needed: Quarkus Dev Services starts
      # a database in Docker by itself (Docker is available on GitHub runners).
      - name: Build and test
        run: ./mvnw -B verify
