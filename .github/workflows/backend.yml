name: Backend (Django)

on:
  push:
    branches: [main, dev]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Une vraie base PostgreSQL 16, comme dans docker-compose.yml
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: echange_temps
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # Les variables lues par config/settings.py (à la place du .env)
    env:
      DB_NAME: echange_temps
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "5432"
      SECRET_KEY: cle-uniquement-pour-la-ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatage (ruff format)
        run: ruff format --check .

      - name: Vérifications Django
        run: python manage.py check

      - name: Pas de migration oubliée
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test
