# ----- Database -----
quarkus.datasource.db-kind=postgresql
# The schema is managed by Flyway, never by Hibernate
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# ----- Dev Services (database started automatically by Quarkus) -----
quarkus.datasource.devservices.db-name=echange_temps
quarkus.datasource.devservices.username=dev
quarkus.datasource.devservices.password=dev
# Fixed port in dev only, so DBeaver always finds it.
# Tests get a random port, so they can run while quarkus:dev is running.
%dev.quarkus.datasource.devservices.port=5432

# ----- Dev & tests: demo data + check entities against the schema -----
%dev.quarkus.flyway.locations=db/migration,db/demo-data
%test.quarkus.flyway.locations=db/migration,db/demo-data
%dev.quarkus.hibernate-orm.schema-management.strategy=validate
%test.quarkus.hibernate-orm.schema-management.strategy=validate

# ----- CORS (Angular dev server) -----
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200

# ----- Prod: values come from environment variables (.env / docker compose) -----
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# ----- TEMPORARY: author of new listings, until authentication exists -----
# Must be a user from the demo data. Remove when JWT login is added.
app.temporary-author-email=karima@echange-temps.test

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.info-title=Time API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=Open-source mutual aid time-exchange platform
